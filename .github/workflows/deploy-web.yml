name: IPTScreening-WebDeploy

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

env:
  # API origin the SPA calls. config.ts appends "/api".
  VITE_API_URL: https://iptscreening-api.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build web app
        run: npm run web:build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Pre-built app: skip the Oryx build and upload dist directly.
          app_location: packages/web/dist
          skip_app_build: true
          skip_api_build: true
